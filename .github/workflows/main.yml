name: Atualizar Agenda Studio Clean

on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Copiar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar bibliotecas necessárias
        run: |
          pip install requests pandas gspread google-auth

      - name: Sincronizar relógio do sistema (NTP)
        run: sudo ntpdate -s time.google.com || sudo timedatectl set-ntp true

      - name: Rodar o script de atualização
        run: |
          python studio_clean_sync_3.py
        env:
          GOOGLE_CREDENTIALS_B64: ${{ secrets.GOOGLE_CREDENTIALS_B64 }}
          MEU_EMAIL: ${{ secrets.MEU_EMAIL }}
          SENHA_APP: ${{ secrets.SENHA_APP }}
          PYTHONUNBUFFERED: '1'

