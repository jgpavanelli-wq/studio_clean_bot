name: Atualizar Agenda Studio Clean

on:
  schedule:
    # Roda todo dia às 08:00 e às 18:00 (horário de Brasilia = UTC - 3)
    - cron: '0 11,21 * * *'
  workflow_dispatch: # Permite que você clique em um botão para testar quando quiser

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Copiar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar bibliotecas necessárias
        run: |
          pip install requests pandas gspread google-auth

      - name: Rodar o script de atualização
        run: |
          python studio_clean_sync_3.py
        env:
          # Se precisar passar variáveis de ambiente, colocamos aqui
          PYTHONUNBUFFERED: '1'
